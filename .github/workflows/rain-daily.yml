name: Rain reminder (DAILY)

on:
  schedule:
    - cron: '0 20 * * *'   # 7 AM Melbourne during AEDT (daylight saving)
    - cron: '0 21 * * *'   # 7 AM Melbourne during AEST (standard time)
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Check it's actually 7 AM in Melbourne
        run: |
          HOUR=$(TZ="Australia/Melbourne" date +%H)
          if [ "$HOUR" != "07" ]; then
            echo "Not 7 AM in Melbourne (it's ${HOUR}:00) — skipping."
            exit 0
          fi
          echo "It's 7 AM in Melbourne — proceeding."

      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests python-dotenv
      - run: python main.py
        env:
          EMAIL_USER:      ${{ secrets.EMAIL_USER }}
          EMAIL_PASS:      ${{ secrets.EMAIL_PASS }}
          WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
